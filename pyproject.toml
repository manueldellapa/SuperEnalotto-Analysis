[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "superenalotto-analysis"
version = "0.1.0"
description = "SuperEnalotto historical extraction downloader and analysis toolkit"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "requests>=2.32,<3",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "types-beautifulsoup4",
    "types-requests",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py314"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.mypy]
python_version = "3.14"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]