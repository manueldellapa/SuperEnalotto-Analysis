name: CI

# Pushes to main plus pull requests targeting main. Release preparation also
# dispatches this workflow explicitly on its generated branch because GitHub
# intentionally suppresses pull_request workflows for PRs created with the
# repository GITHUB_TOKEN.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow only reads the repository. Stating it explicitly also overrides
# a repository default that may be read-write.
permissions:
  contents: read

# Supersede the previous run of a pull request when it is updated. Pushes to
# main and explicit release validations group by commit SHA, so each commit
# keeps its own status and no run is left queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    # The gates take seconds; this only caps a hung network install instead of
    # letting it run into the six-hour default.
    timeout-minutes: 10

    steps:
      # Must come before setup-uv: `uv venv` reads .python-version out of the
      # checked-out tree.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config while
          # dependency builds and the test suite run on this runner.
          persist-credentials: false

      # Both actions are pinned to a commit SHA with the tag in a comment;
      # .github/dependabot.yml keeps them current. setup-uv has no moving major
      # tag to fall back on — upstream stopped publishing them after v7, so
      # "simplifying" this to @v9 fails the run with an unresolvable action.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The action's default cache-dependency-glob already covers
          # **/uv.lock and **/pyproject.toml, so the key tracks the lockfile
          # without any configuration here.
          enable-cache: true
          # Create and activate .venv via `uv venv`, which resolves the
          # interpreter from .python-version (3.14.4, inside the
          # requires-python ">=3.14,<3.15" range). Later steps get that venv's
          # python on PATH — each run step is a fresh shell, so without this
          # they would not. Load-bearing: dropping it breaks the install step.
          activate-environment: true

      # Installs the exact versions in uv.lock, transitives included, against
      # the venv the previous step activated. Two guards ride on this one step:
      # --locked fails the run if uv.lock has drifted from pyproject.toml, so a
      # dependency edit cannot land without its lockfile update, and the
      # requires-python check fails here on any interpreter that is not
      # 3.14.x. Not `uv pip install`: that is the pip-compatible interface and
      # ignores uv.lock, which would leave the repo locked in name only.
      - name: Install the project with development dependencies
        run: uv sync --locked --all-extras

      # No continue-on-error and no step conditions below: whichever gate
      # fails, fails the job. Ordered cheapest first.
      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src scripts tests

      - name: Test
        run: python -m pytest
