name: CI

# Pushes to main plus pull requests targeting main. That pairing is also what
# keeps runs from doubling up: a branch in this repo fires only pull_request
# (its pushes are not to main), and the merge commit fires only push.
# pull_request (not pull_request_target) means fork PRs run with a read-only
# token and no access to secrets.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This workflow only reads the repository. Stating it explicitly also overrides
# a repository default that may be read-write.
permissions:
  contents: read

# Supersede the previous run of a pull request when it is updated. Pushes to
# main group by commit SHA instead, so each commit keeps its own status and no
# run is ever cancelled or left queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    # The gates take seconds; this only caps a hung network install instead of
    # letting it run into the six-hour default.
    timeout-minutes: 10

    steps:
      # Must come before setup-uv: `uv venv` reads .python-version out of the
      # checked-out tree.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the token out of .git/config while
          # dependency builds and the test suite run on this runner.
          persist-credentials: false

      # Both actions are pinned to a commit SHA with the tag in a comment;
      # .github/dependabot.yml keeps them current. setup-uv has no moving major
      # tag to fall back on — upstream stopped publishing them after v7, so
      # "simplifying" this to @v9 fails the run with an unresolvable action.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The action's default cache-dependency-glob already covers
          # **/pyproject.toml — this repo's only dependency declaration — and
          # **/uv.lock, so the key invalidates when dependencies change and a
          # lockfile added later needs no change here.
          enable-cache: true
          # Create and activate .venv via `uv venv`, which resolves the
          # interpreter from .python-version (3.14.4, inside the
          # requires-python ">=3.14,<3.15" range). Later steps get that venv's
          # python on PATH — each run step is a fresh shell, so without this
          # they would not. Load-bearing: dropping it breaks the install step.
          activate-environment: true

      # Mirrors the setup documented in CLAUDE.md. This step is also the guard
      # that CI really is on Python 3.14.x: any other interpreter fails the
      # requires-python check right here.
      - name: Install the project with development dependencies
        run: uv pip install -e ".[dev]"

      # No continue-on-error and no step conditions below: whichever gate
      # fails, fails the job. Ordered cheapest first.
      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src scripts tests

      - name: Test
        run: python -m pytest
