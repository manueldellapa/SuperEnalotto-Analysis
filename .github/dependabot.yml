version: 2

updates:
  # The CI workflow pins both actions to a commit SHA, and astral-sh/setup-uv
  # publishes no moving major tag, so without this the pins age indefinitely.
  # Dependabot rewrites the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # uv.lock pins every dependency, transitives included, so nothing moves on
  # its own any more — the ranges in pyproject.toml stopped being what CI
  # installs. This is what keeps the pins from ageing: Dependabot proposes the
  # bumps, CI proves them, and the alternative is remembering to run
  # `uv lock --upgrade` by hand.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
